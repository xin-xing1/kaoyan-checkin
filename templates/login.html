<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 · 考研打卡</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-card">
        <h1>考研备考监督打卡系统</h1>
        <div class="tabs">
            <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
            <button class="tab" id="tabReg" onclick="switchTab('register')">注册</button>
        </div>

        <form id="loginForm" class="auth-form">
            <input type="text" id="loginPhone" placeholder="手机号" required>
            <input type="password" id="loginPassword" placeholder="密码" required>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>

        <form id="regForm" class="auth-form hidden">
            <input type="text" id="regPhone" placeholder="手机号" required>
            <input type="text" id="regNickname" placeholder="昵称" required>
            <input type="password" id="regPassword" placeholder="密码（至少6位）" required>
            <button type="submit" class="btn btn-primary">注 册</button>
        </form>
        <p id="msg" class="msg"></p>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
