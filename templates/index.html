{% extends "base.html" %}
{% block title %}工作台{% endblock %}
{% block content %}
    <section class="panel">
        <h2>学习概览</h2>
        <div id="statsBox" class="overview"></div>
        <div id="topList" class="rank-list"></div>
    </section>

    <section class="panel">
        <h2>快捷入口</h2>
        <div class="quick-links">
            <a href="/goals" class="btn btn-primary">目标管理</a>
            <a href="/plans" class="btn btn-primary">阶段计划</a>
            <a href="/tasks" class="btn btn-primary">任务管理</a>
            <a href="/checkin" class="btn btn-success">每日打卡</a>
            <a href="/supervise" class="btn btn-primary">研友监督</a>
            <a href="/rewards" class="btn btn-primary">积分勋章</a>
        </div>
    </section>

    <section class="panel">
        <h2>最近目标</h2>
        <table class="table">
            <thead><tr><th>目标院校</th><th>目标专业</th><th>目标分数</th><th>备考阶段</th><th>状态</th></tr></thead>
            <tbody id="goalTable"></tbody>
        </table>
    </section>

    <section class="panel">
        <h2>最近计划</h2>
        <table class="table">
            <thead><tr><th>计划名称</th><th>阶段</th><th>起止日期</th></tr></thead>
            <tbody id="planTable"></tbody>
        </table>
    </section>

    <section class="panel">
        <h2>近期任务</h2>
        <table class="table">
            <thead><tr><th>任务名称</th><th>科目</th><th>截止时间</th><th>状态</th></tr></thead>
            <tbody id="taskTable"></tbody>
        </table>
    </section>

    <section class="panel">
        <h2>我的勋章</h2>
        <div id="badgeWall" class="badge-wall"></div>
    </section>
{% endblock %}
{% block scripts %}
<script>
    const uid = {{ session['uid'] }};
    async function loadStats() {
        const data = await api("/api/stats");
        if (data.code !== 0) return;
        const box = document.getElementById("statsBox");
        box.innerHTML = `
            <div class="stat-card"><b>${data.checkin ? data.checkin["打卡次数"] : 0}</b>累计打卡</div>
            <div class="stat-card"><b>${data.checkin ? data.checkin["打卡天数"] : 0}</b>打卡天数</div>
            <div class="stat-card"><b>${data.rank ? data.rank["总积分"] : 0}</b>我的积分</div>
            <div class="stat-card"><b>${data.task ? data.task["完成率(%)"] ?? "-" : "-"}</b>任务完成率</div>
        `;
        const top = document.getElementById("topList");
        top.innerHTML = (data.top10 || []).map((r, i) =>
            `<li class="${r["用户ID"] === uid ? 'me' : ''}"><span>${i + 1}. ${r["昵称"]}</span><span>${r["总积分"]} 分</span></li>`).join("");
    }
    document.addEventListener("DOMContentLoaded", async () => {
        const g = await api("/api/goals");
        document.getElementById("goalTable").innerHTML = (g.data || []).slice(0, 5).map(x =>
            `<tr><td>${x["目标院校"]}</td><td>${x["目标专业"]}</td><td>${x["目标分数"]}</td><td>${x["备考阶段"]}</td><td>${x["状态"]}</td></tr>`).join("") || '<tr><td colspan="5" class="empty">暂无目标</td></tr>';

        const p = await api("/api/plans");
        document.getElementById("planTable").innerHTML = (p.data || []).slice(0, 5).map(x =>
            `<tr><td>${x["计划名称"]}</td><td>${x["阶段"]}</td><td>${x["开始日期"]} ~ ${x["结束日期"]}</td></tr>`).join("") || '<tr><td colspan="3" class="empty">暂无计划</td></tr>';

        const t = await api("/api/tasks");
        document.getElementById("taskTable").innerHTML = (t.data || []).slice(0, 5).map(x =>
            `<tr><td>${x["任务名称"]}</td><td>${x["科目"]}</td><td>${x["截止时间"]}</td><td>${x["完成状态"]}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">暂无任务</td></tr>';

        const b = await api("/api/badges");
        document.getElementById("badgeWall").innerHTML = (b.data || []).slice(0, 8).map(x =>
            `<div class="badge-card"><div class="icon">🏅</div><div class="name">${x["勋章类型"]}</div><div class="time">${x["获得时间"]}</div></div>`).join("") || '<span class="empty">暂无勋章，快去打卡赢取吧</span>';
    });
</script>
{% endblock %}
